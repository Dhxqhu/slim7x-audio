# Slim 7x speaker DSP — brighter, notch leftover static.
#
# Still a little static but brighter OK. Deepen ~6.1k grit; move crisp away
# from that zone; colder tweeter ceiling. Keep body/brightness makeups.
#
# PCM: FL/FR woofers, RL/RR keyboard tweeters. ALSA Speakers pads: 6,5,6,5.
# Refs: Triforce = bass; Peg verse/chorus = snap vs mid clutter.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers (Crossover)"
            media.name       = "Speakers (Crossover)"
            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = conv_l
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 0
                            gain = 1.0        # 0 dB — loudness recover (peaks still limited)
                        }
                    }
                    {
                        type = builtin
                        name = conv_r
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 1
                            gain = 1.0        # 0 dB — loudness recover (peaks still limited)
                        }
                    }

                    # Psychoacoustic kick weight (tiny woofers can't move real 50 Hz)
                    {
                        type    = lv2
                        name    = bassex
                        plugin  = "https://chadmed.au/bankstown"
                        control = {
                            "bypass"     = 0
                            "amt"        = 0.70
                            "sat_second" = 0.3
                            "sat_third"  = 0.12
                            "blend"      = 0.32
                            "ceil"       = 170.0
                            "floor"      = 50.0
                            "final_hp"   = 140.0
                        }
                    }

                    {
                        type    = lv2
                        name    = mbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            "envb"  = 0
                            "cbe_1" = 1
                            "sf_1"  = 80.0       # sub | bass  (EDM 40–50 Hz hotspot)
                            "cbe_2" = 1
                            "sf_2"  = 450.0
                            "cbe_3" = 1
                            "sf_3"  = 2800.0

                            # Sub <80 — dyn sit-down when EDM drops hit (captures: +6–18 dB @40–50)
                            "ce_0" = 1
                            "al_0" = 0.05012   # -26 dB
                            "cr_0" = 24.0
                            "at_0" = 2.0
                            "rt_0" = 220.0
                            "kn_0" = 0.15849
                            "mk_0" = 1.0       # no sub makeup — BOOST would flap

                            # Bass/punch — kick beater; hard sit on held notes (no softclip cook)
                            "ce_1" = 1
                            "al_1" = 0.03981   # -28 dB
                            "cr_1" = 18.0
                            "at_1" = 10.0
                            "rt_1" = 80.0
                            "kn_1" = 0.12589
                            "mk_1" = 1.99526   # +6 dB — clean; loudness from mid/high

                            # Mid 450–2800 — sit muddy mid cloud; don't restore it
                            "ce_2" = 1
                            "al_2" = 0.03981   # -28 dB
                            "cr_2" = 22.0
                            "at_2" = 6.0
                            "rt_2" = 180.0
                            "kn_2" = 0.11220
                            "mk_2" = 1.58489   # +4 dB — fill hollow mid

                            # High >2800 — light; Steely snap comes from keyboard EQ
                            "ce_3" = 1
                            "al_3" = 0.28184   # -11 dB
                            "cr_3" = 1.6
                            "at_3" = 2.0
                            "rt_3" = 50.0
                            "kn_3" = 0.50119
                            "mk_3" = 1.49624   # +3.5 dB — crisp without pile-up
                        }
                    }


                    # Gentle overall air — brighten without mid shout
                    {
                        type    = builtin
                        name    = air_l
                        label   = bq_highshelf
                        control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 0.5 }
                    }
                    {
                        type    = builtin
                        name    = air_r
                        label   = bq_highshelf
                        control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 0.5 }
                    }

                    # Dolby-like clarity: subtle harmonic exciter (not surround matrix —
                    # these 4 drivers are a 2-way stereo pair, RL/RR = keyboard tweeters)
                    {
                        type    = lv2
                        name    = clarity
                        plugin  = "http://calf.sourceforge.net/plugins/Exciter"
                        control = {
                            "bypass"     = 1
                            "level_in"   = 1.0
                            "level_out"  = 1.0
                            "amount"     = 0.0
                            "drive"      = 1.0
                            "blend"      = 1.0
                            "freq"       = 8000.0
                            "listen"     = 0
                            "ceil_active"= 1
                            "ceil"       = 10500.0
                        }
                    }

                    {
                        type    = builtin
                        name    = crisp_l
                        label   = bq_peaking
                        control = { "Freq" = 4600.0 "Q" = 2.4 "Gain" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = crisp_r
                        label   = bq_peaking
                        control = { "Freq" = 4600.0 "Q" = 2.4 "Gain" = 0.0 }
                    }
                    {
                        type    = lv2
                        name    = crossover
                        plugin  = "http://lsp-plug.in/plugins/lv2/crossover_stereo"
                        control = {
                            "sf_1"  = 1100.0
                            "frs_1" = 2
                            "frs_2" = 0
                            "frs_3" = 0
                            "frs_4" = 0
                            "frs_5" = 0
                            "frs_6" = 0
                            "frs_7" = 0
                        }
                    }

                    # Extra woofer HPF — content below this only flaps the cone
                    {
                        type    = builtin
                        name    = woofer_hp_l
                        label   = bq_highpass
                        control = { "Freq" = 150.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = woofer_hp_r
                        label   = bq_highpass
                        control = { "Freq" = 150.0 "Q" = 0.707 }
                    }
                    # Kick body through the woofers (was a cut — that killed Windows punch)
                    {
                        type    = builtin
                        name    = woofer_bass_l
                        label   = bq_lowshelf
                        control = { "Freq" = 220.0 "Q" = 0.7 "Gain" = 1.0 }
                    }
                    {
                        type    = builtin
                        name    = woofer_bass_r
                        label   = bq_lowshelf
                        control = { "Freq" = 220.0 "Q" = 0.7 "Gain" = 1.0 }
                    }
                    # Kick thump peak (was −2 mud cut eating the beater)
                    {
                        type    = builtin
                        name    = woofer_mud_l
                        label   = bq_peaking
                        control = { "Freq" = 175.0 "Q" = 2.8 "Gain" = 2.5 }
                    }
                    {
                        type    = builtin
                        name    = woofer_mud_r
                        label   = bq_peaking
                        control = { "Freq" = 175.0 "Q" = 2.8 "Gain" = 2.5 }
                    }
                    {
                        type    = builtin
                        name    = woofer_mid_l
                        label   = bq_peaking
                        control = { "Freq" = 520.0 "Q" = 1.1 "Gain" = -2.0 }
                    }
                    {
                        type    = builtin
                        name    = woofer_mid_r
                        label   = bq_peaking
                        control = { "Freq" = 520.0 "Q" = 1.1 "Gain" = -2.0 }
                    }

                    # Woofer-only compressor — last grab on bass peaks before the limiter
                    {
                        type    = lv2
                        name    = woofer_comp
                        plugin  = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                        control = {
                            "cm"   = 0
                            "g_in" = 1.0
                            "g_out"= 1.0
                            "al"   = 0.03981  # -28 dB — held bass notes
                            "cr"   = 22.0
                            "at"   = 8.0
                            "rt"   = 70.0
                            "kn"   = 0.11220
                            "mk"   = 1.41254  # +3 dB — bass back; sustain still grabbed
                            "sla"  = 14.0
                            "slpm" = 2
                            "slpf" = 200.0
                            "shpm" = 0
                        }
                    }

                    # --- Keyboard path: clear mud, dynamically sit mids down, keep crack ---
                    {
                        type    = builtin
                        name    = kb_hp_l
                        label   = bq_highpass
                        control = { "Freq" = 1200.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = kb_hp_r
                        label   = bq_highpass
                        control = { "Freq" = 1200.0 "Q" = 0.707 }
                    }
                    # Static mud / box that makes keyboard drown the mix
                    {
                        type    = builtin
                        name    = kb_mud_l
                        label   = bq_peaking
                        control = { "Freq" = 1500.0 "Q" = 1.1 "Gain" = -4.0 }
                    }
                    {
                        type    = builtin
                        name    = kb_mud_r
                        label   = bq_peaking
                        control = { "Freq" = 1500.0 "Q" = 1.1 "Gain" = -4.0 }
                    }
                    {
                        type    = builtin
                        name    = kb_box_l
                        label   = bq_peaking
                        control = { "Freq" = 3000.0 "Q" = 2.0 "Gain" = -2.5 }
                    }
                    {
                        type    = builtin
                        name    = kb_box_r
                        label   = bq_peaking
                        control = { "Freq" = 3000.0 "Q" = 2.0 "Gain" = -2.5 }
                    }
                    # Donald Fagen reed/rasp (~2.9–3.6k) — narrow static ease
                    {
                        type    = builtin
                        name    = fagen_l
                        label   = bq_peaking
                        control = { "Freq" = 3300.0 "Q" = 3.5 "Gain" = -3.0 }
                    }
                    {
                        type    = builtin
                        name    = fagen_r
                        label   = bq_peaking
                        control = { "Freq" = 3300.0 "Q" = 3.5 "Gain" = -3.0 }
                    }
                    # Dynamic mid control — duck muddy mids when they get loud; leave crack alone
                    {
                        type    = lv2
                        name    = kb_mbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            "envb"  = 0
                            "cbe_1" = 1
                            "sf_1"  = 2200.0   # mud | vocal-rasp
                            "cbe_2" = 1
                            "sf_2"  = 3800.0   # vocal-rasp | snare body
                            "cbe_3" = 1
                            "sf_3"  = 5500.0   # snare | grit/stick

                            # Mid/low mud — dyn only; don't permanently bury level
                            "ce_0" = 1
                            "al_0" = 0.03981   # -28 dB
                            "cr_0" = 22.0
                            "at_0" = 5.0
                            "rt_0" = 200.0
                            "kn_0" = 0.11220
                            "mk_0" = 0.89125   # -1 dB — level back; still ducks

                            # Rasp — harder when loud, less always-on cut
                            "ce_1" = 1
                            "al_1" = 0.05623   # -25 dB
                            "cr_1" = 16.0
                            "at_1" = 5.0
                            "rt_1" = 180.0
                            "kn_1" = 0.15849
                            "mk_1" = 0.89125   # -1 dB — rasp dyn, keep level

                            # Snare — snap through, grab only when hashing
                            "ce_2" = 1
                            "al_2" = 0.14125   # -17 dB
                            "cr_2" = 4.0
                            "at_2" = 8.0
                            "rt_2" = 90.0
                            "kn_2" = 0.31623
                            "mk_2" = 1.12202   # +1 dB — crack back

                            # Stick/static — grab leftover hash; air from EQ above
                            "ce_3" = 1
                            "al_3" = 0.10000   # -20 dB
                            "cr_3" = 7.0
                            "at_3" = 2.5
                            "rt_3" = 60.0
                            "kn_3" = 0.22387
                            "mk_3" = 0.89125   # -1 dB
                        }
                    }
                    # Overall keyboard level (after mid sit-down)
                    {
                        type    = builtin
                        name    = pad_rl
                        label   = bq_highshelf
                        control = { "Freq" = 10.0 "Q" = 0.7 "Gain" = 1.0 }
                    }
                    {
                        type    = builtin
                        name    = pad_rr
                        label   = bq_highshelf
                        control = { "Freq" = 10.0 "Q" = 0.7 "Gain" = 1.0 }
                    }
                    {
                        type    = builtin
                        name    = snare_rl
                        label   = bq_peaking
                        control = { "Freq" = 4300.0 "Q" = 2.8 "Gain" = 1.0 }
                    }
                    {
                        type    = builtin
                        name    = snare_rr
                        label   = bq_peaking
                        control = { "Freq" = 4300.0 "Q" = 2.8 "Gain" = 1.0 }
                    }
                    {
                        type    = builtin
                        name    = snare2_rl
                        label   = bq_peaking
                        control = { "Freq" = 5600.0 "Q" = 2.2 "Gain" = -2.5 }
                    }
                    {
                        type    = builtin
                        name    = snare2_rr
                        label   = bq_peaking
                        control = { "Freq" = 5600.0 "Q" = 2.2 "Gain" = -2.5 }
                    }
                    {
                        type    = builtin
                        name    = snap_rl
                        label   = bq_peaking
                        control = { "Freq" = 8500.0 "Q" = 2.6 "Gain" = 1.25 }
                    }
                    {
                        type    = builtin
                        name    = snap_rr
                        label   = bq_peaking
                        control = { "Freq" = 8500.0 "Q" = 2.6 "Gain" = 1.25 }
                    }
                    # 3) EDM grit notch ~6.1 kHz (capture peak cluster)
                    {
                        type    = builtin
                        name    = grit_rl
                        label   = bq_peaking
                        control = { "Freq" = 6200.0 "Q" = 1.6 "Gain" = -5.5 }
                    }
                    {
                        type    = builtin
                        name    = grit_rr
                        label   = bq_peaking
                        control = { "Freq" = 6200.0 "Q" = 1.6 "Gain" = -5.5 }
                    }
                    {
                        type    = builtin
                        name    = hiss_rl
                        label   = bq_highshelf
                        control = { "Freq" = 9500.0 "Q" = 0.7 "Gain" = 1.0 }
                    }
                    {
                        type    = builtin
                        name    = hiss_rr
                        label   = bq_highshelf
                        control = { "Freq" = 9500.0 "Q" = 0.7 "Gain" = 1.0 }
                    }

                    {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            # Note: LSP limiter rt/at max out at 20 ms — higher values are invalid
                            "alr"   = 0
                            "boost" = 0
                            "mode"  = 8         # Line Thin — clean ceiling
                            "at"    = 0.3
                            "rt"    = 14
                            "lk"    = 14
                            "ovs"   = 12
                            "th"    = 0.89125   # -1 dBFS — stay under softclip; clean volume elsewhere
                            "knee"  = 0.35481
                        }
                    }

                    # Kill fizzy >12 kHz on keyboard; crisp lives below that
                    {
                        type    = builtin
                        name    = kb_aircut_l
                        label   = bq_lowpass
                        control = { "Freq" = 12500.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = kb_aircut_r
                        label   = bq_lowpass
                        control = { "Freq" = 12500.0 "Q" = 0.707 }
                    }
                    {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            "alr"   = 0
                            "boost" = 0
                            "mode"  = 8
                            "at"    = 0.35
                            "rt"    = 12
                            "lk"    = 12
                            "ovs"   = 12
                            "th"    = 0.79433   # -2 dBFS — catch leftover static
                            "knee"  = 0.50119
                        }
                    }
                ]
                links = [
                    { output = "conv_l:Out"         input = "bassex:in_l" }
                    { output = "conv_r:Out"         input = "bassex:in_r" }
                    { output = "bassex:out_l"       input = "mbc:in_l" }
                    { output = "bassex:out_r"       input = "mbc:in_r" }
                    { output = "mbc:out_l"          input = "air_l:In" }
                    { output = "mbc:out_r"          input = "air_r:In" }
                    { output = "air_l:Out"          input = "clarity:in_l" }
                    { output = "air_r:Out"          input = "clarity:in_r" }
                    { output = "clarity:out_l"      input = "crisp_l:In" }
                    { output = "clarity:out_r"      input = "crisp_r:In" }
                    { output = "crisp_l:Out"        input = "crossover:in_l" }
                    { output = "crisp_r:Out"        input = "crossover:in_r" }
                    { output = "crossover:band0l"   input = "woofer_hp_l:In" }
                    { output = "crossover:band0r"   input = "woofer_hp_r:In" }
                    { output = "woofer_hp_l:Out"    input = "woofer_bass_l:In" }
                    { output = "woofer_hp_r:Out"    input = "woofer_bass_r:In" }
                    { output = "woofer_bass_l:Out"  input = "woofer_mud_l:In" }
                    { output = "woofer_bass_r:Out"  input = "woofer_mud_r:In" }
                    { output = "woofer_mud_l:Out"   input = "woofer_mid_l:In" }
                    { output = "woofer_mud_r:Out"   input = "woofer_mid_r:In" }
                    { output = "woofer_mid_l:Out"   input = "woofer_comp:in_l" }
                    { output = "woofer_mid_r:Out"   input = "woofer_comp:in_r" }
                    { output = "woofer_comp:out_l"  input = "limiter_f:in_l" }
                    { output = "woofer_comp:out_r"  input = "limiter_f:in_r" }
                    { output = "crossover:band1l"   input = "kb_hp_l:In" }
                    { output = "crossover:band1r"   input = "kb_hp_r:In" }
                    { output = "kb_hp_l:Out"        input = "kb_mud_l:In" }
                    { output = "kb_hp_r:Out"        input = "kb_mud_r:In" }
                    { output = "kb_mud_l:Out"       input = "kb_box_l:In" }
                    { output = "kb_mud_r:Out"       input = "kb_box_r:In" }
                    { output = "kb_box_l:Out"       input = "fagen_l:In" }
                    { output = "kb_box_r:Out"       input = "fagen_r:In" }
                    { output = "fagen_l:Out"        input = "kb_mbc:in_l" }
                    { output = "fagen_r:Out"        input = "kb_mbc:in_r" }
                    { output = "kb_mbc:out_l"       input = "pad_rl:In" }
                    { output = "kb_mbc:out_r"       input = "pad_rr:In" }
                    { output = "pad_rl:Out"         input = "snare_rl:In" }
                    { output = "pad_rr:Out"         input = "snare_rr:In" }
                    { output = "snare_rl:Out"       input = "snare2_rl:In" }
                    { output = "snare_rr:Out"       input = "snare2_rr:In" }
                    { output = "snare2_rl:Out"      input = "snap_rl:In" }
                    { output = "snare2_rr:Out"      input = "snap_rr:In" }
                    { output = "snap_rl:Out"        input = "grit_rl:In" }
                    { output = "snap_rr:Out"        input = "grit_rr:In" }
                    { output = "grit_rl:Out"        input = "hiss_rl:In" }
                    { output = "grit_rr:Out"        input = "hiss_rr:In" }
                    { output = "hiss_rl:Out"        input = "kb_aircut_l:In" }
                    { output = "hiss_rr:Out"        input = "kb_aircut_r:In" }
                    { output = "kb_aircut_l:Out"    input = "limiter_r:in_l" }
                    { output = "kb_aircut_r:Out"    input = "limiter_r:in_r" }
                ]
                inputs  = [ "conv_l:In" "conv_r:In" ]
                # HW PCM: FL/FR = woofers L/R, RL/RR = tweeters L/R (grouped — verified by ear)
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
            }
            capture.props = {
                node.name           = "audio_effect.slim7x_crossover"
                media.class         = Audio/Sink
                audio.channels      = 2
                audio.position      = [ FL FR ]
                device.api          = dsp
                node.virtual        = false
                priority.session    = 900
                device.icon-name    = "audio-speakers"
            }
            playback.props = {
                node.name           = "effect_output.slim7x_crossover"
                node.description    = "Slim 7x Speakers DSP Out"
                media.name          = "Slim 7x Speakers DSP Out"
                node.dont-fallback  = false
                node.passive        = true
                target.object       = "alsa_output.platform-sound.HiFi__Speaker__sink"
                audio.channels      = 4
                audio.position      = [ FL FR RL RR ]
            }
        }
    }
]
