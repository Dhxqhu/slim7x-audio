# Slim 7x speaker DSP — stacked-stab pop micro.
#
# Crossover pop when one stab hits over another. Tiny colder ceilings +
# faster mid/stick grab on stacked peaks. No XO/EQ tone redo.
#
# PCM: FL/FR woofers, RL/RR keyboard tweeters. ALSA Speakers pads: 6,5,6,5.
# Refs: Triforce = bass; Peg verse/chorus = snap vs mid clutter.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers (Crossover)"
            media.name       = "Speakers (Crossover)"
            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = conv_l
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 0
                            gain = 1.41254    # +3 dB — overall level (peaks limited)
                        }
                    }
                    {
                        type = builtin
                        name = conv_r
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 1
                            gain = 1.41254    # +3 dB — overall level (peaks limited)
                        }
                    }

                    # Psychoacoustic kick weight (tiny woofers can't move real 50 Hz)
                    {
                        type    = lv2
                        name    = bassex
                        plugin  = "https://chadmed.au/bankstown"
                        control = {
                            "bypass"     = 0
                            "amt"        = 0.50
                            "sat_second" = 0.16
                            "sat_third"  = 0.05
                            "blend"      = 0.24
                            "ceil"       = 160.0
                            "floor"      = 55.0
                            "final_hp"   = 148.0
                        }
                    }

                    {
                        type    = lv2
                        name    = mbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            "envb"  = 0
                            "cbe_1" = 1
                            "sf_1"  = 80.0       # sub | bass  (EDM 40–50 Hz hotspot)
                            "cbe_2" = 1
                            "sf_2"  = 350.0      # include bass/guitar overlap
                            "cbe_3" = 1
                            "sf_3"  = 2800.0

                            # Sub <80 — dyn sit-down when EDM drops hit (captures: +6–18 dB @40–50)
                            "ce_0" = 1
                            "al_0" = 0.05012   # -26 dB
                            "cr_0" = 24.0
                            "at_0" = 2.0
                            "rt_0" = 220.0
                            "kn_0" = 0.15849
                            "mk_0" = 1.0       # no sub makeup — BOOST would flap

                            # Bass/punch — kick beater; hard sit on held notes (no softclip cook)
                            "ce_1" = 1
                            "al_1" = 0.03981   # -28 dB — denser stacks only
                            "cr_1" = 24.0
                            "at_1" = 12.0
                            "rt_1" = 55.0
                            "kn_1" = 0.08913
                            "mk_1" = 1.77828   # +5 dB — bass definition

                            # Mid — catch stacked stabs; sparse fill kept
                            "ce_2" = 1
                            "al_2" = 0.05957   # -24.5 dB
                            "cr_2" = 40.0
                            "at_2" = 1.2
                            "rt_2" = 70.0
                            "kn_2" = 0.06310
                            "mk_2" = 1.63096   # +4.25 dB — density, eased from +4.5

                            # High >2800 — light; Steely snap comes from keyboard EQ
                            "ce_3" = 1
                            "al_3" = 0.28184   # -11 dB
                            "cr_3" = 1.6
                            "at_3" = 2.0
                            "rt_3" = 50.0
                            "kn_3" = 0.50119
                            "mk_3" = 1.49624   # +3.5 dB — density without cymbal slice
                        }
                    }


                    # Gentle overall air — brighten without mid shout
                    {
                        type    = builtin
                        name    = air_l
                        label   = bq_highshelf
                        control = { "Freq" = 9000.0 "Q" = 0.9 "Gain" = 0.3 }
                    }
                    {
                        type    = builtin
                        name    = air_r
                        label   = bq_highshelf
                        control = { "Freq" = 9000.0 "Q" = 0.9 "Gain" = 0.3 }
                    }

                    # Dolby-like clarity: subtle harmonic exciter (not surround matrix —
                    # these 4 drivers are a 2-way stereo pair, RL/RR = keyboard tweeters)
                    {
                        type    = lv2
                        name    = clarity
                        plugin  = "http://calf.sourceforge.net/plugins/Exciter"
                        control = {
                            "bypass"     = 1
                            "level_in"   = 1.0
                            "level_out"  = 1.0
                            "amount"     = 0.0
                            "drive"      = 1.0
                            "blend"      = 1.0
                            "freq"       = 8000.0
                            "listen"     = 0
                            "ceil_active"= 1
                            "ceil"       = 10500.0
                        }
                    }

                    {
                        type    = builtin
                        name    = crisp_l
                        label   = bq_peaking
                        control = { "Freq" = 4600.0 "Q" = 2.4 "Gain" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = crisp_r
                        label   = bq_peaking
                        control = { "Freq" = 4600.0 "Q" = 2.4 "Gain" = 0.0 }
                    }
                    {
                        type    = lv2
                        name    = crossover
                        plugin  = "http://lsp-plug.in/plugins/lv2/crossover_stereo"
                        control = {
                            "sf_1"  = 1350.0
                            "frs_1" = 2
                            "frs_2" = 0
                            "frs_3" = 0
                            "frs_4" = 0
                            "frs_5" = 0
                            "frs_6" = 0
                            "frs_7" = 0
                        }
                    }

                    # Extra woofer HPF — content below this only flaps the cone
                    {
                        type    = builtin
                        name    = woofer_hp_l
                        label   = bq_highpass
                        control = { "Freq" = 160.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = woofer_hp_r
                        label   = bq_highpass
                        control = { "Freq" = 160.0 "Q" = 0.707 }
                    }
                    # Kick body through the woofers (was a cut — that killed Windows punch)
                    {
                        type    = builtin
                        name    = woofer_bass_l
                        label   = bq_lowshelf
                        control = { "Freq" = 220.0 "Q" = 0.7 "Gain" = 0.5 }
                    }
                    {
                        type    = builtin
                        name    = woofer_bass_r
                        label   = bq_lowshelf
                        control = { "Freq" = 220.0 "Q" = 0.7 "Gain" = 0.5 }
                    }
                    # Kick thump peak (was −2 mud cut eating the beater)
                    {
                        type    = builtin
                        name    = woofer_mud_l
                        label   = bq_peaking
                        control = { "Freq" = 180.0 "Q" = 2.4 "Gain" = 1.5 }
                    }
                    {
                        type    = builtin
                        name    = woofer_mud_r
                        label   = bq_peaking
                        control = { "Freq" = 180.0 "Q" = 2.4 "Gain" = 1.5 }
                    }
                    {
                        type    = builtin
                        name    = woofer_mid_l
                        label   = bq_peaking
                        control = { "Freq" = 380.0 "Q" = 0.8 "Gain" = -3.5 }
                    }
                    {
                        type    = builtin
                        name    = woofer_mid_r
                        label   = bq_peaking
                        control = { "Freq" = 380.0 "Q" = 0.8 "Gain" = -3.5 }
                    }

                    # Woofer-only compressor — last grab on bass peaks before the limiter
                    {
                        type    = lv2
                        name    = woofer_comp
                        plugin  = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                        control = {
                            "cm"   = 0
                            "g_in" = 1.0
                            "g_out"= 1.0
                            "al"   = 0.06310  # -24 dB — stacked stab pops
                            "cr"   = 36.0
                            "at"   = 7.0
                            "rt"   = 40.0
                            "kn"   = 0.06310
                            "mk"   = 1.25893  # +2 dB — punch kept
                            "sla"  = 14.0
                            "slpm" = 2
                            "slpf" = 200.0
                            "shpm" = 0
                        }
                    }

                    # --- Keyboard path: clear mud, dynamically sit mids down, keep crack ---
                    {
                        type    = builtin
                        name    = kb_hp_l
                        label   = bq_highpass
                        control = { "Freq" = 1700.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = kb_hp_r
                        label   = bq_highpass
                        control = { "Freq" = 1700.0 "Q" = 0.707 }
                    }
                    # Static mud / box that makes keyboard drown the mix
                    {
                        type    = builtin
                        name    = kb_mud_l
                        label   = bq_peaking
                        control = { "Freq" = 1800.0 "Q" = 1.0 "Gain" = -3.5 }
                    }
                    {
                        type    = builtin
                        name    = kb_mud_r
                        label   = bq_peaking
                        control = { "Freq" = 1800.0 "Q" = 1.0 "Gain" = -3.5 }
                    }
                    {
                        type    = builtin
                        name    = kb_box_l
                        label   = bq_peaking
                        control = { "Freq" = 2950.0 "Q" = 2.2 "Gain" = -3.5 }
                    }
                    {
                        type    = builtin
                        name    = kb_box_r
                        label   = bq_peaking
                        control = { "Freq" = 2950.0 "Q" = 2.2 "Gain" = -3.5 }
                    }
                    # Donald Fagen reed/rasp (~2.9–3.6k) — narrow static ease
                    {
                        type    = builtin
                        name    = fagen_l
                        label   = bq_peaking
                        control = { "Freq" = 3350.0 "Q" = 2.5 "Gain" = -5.0 }
                    }
                    {
                        type    = builtin
                        name    = fagen_r
                        label   = bq_peaking
                        control = { "Freq" = 3350.0 "Q" = 2.5 "Gain" = -5.0 }
                    }
                    # Dynamic mid control — duck muddy mids when they get loud; leave crack alone
                    {
                        type    = lv2
                        name    = kb_mbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            "envb"  = 0
                            "cbe_1" = 1
                            "sf_1"  = 2200.0   # mud | vocal-rasp
                            "cbe_2" = 1
                            "sf_2"  = 3800.0   # vocal-rasp | snare body
                            "cbe_3" = 1
                            "sf_3"  = 5200.0   # snare | cymbal crack

                            # Keyboard low edge — sit when it muddies bass
                            "ce_0" = 1
                            "al_0" = 0.05623   # -25 dB
                            "cr_0" = 26.0
                            "at_0" = 4.0
                            "rt_0" = 160.0
                            "kn_0" = 0.10000
                            "mk_0" = 1.0       # 0 dB — less hollow

                            # Mid vocal/guitar wail — sit when it hashes
                            "ce_1" = 1
                            "al_1" = 0.04732   # -26.5 dB
                            "cr_1" = 30.0
                            "at_1" = 4.0
                            "rt_1" = 140.0
                            "kn_1" = 0.07943
                            "mk_1" = 0.94406   # -0.5 dB — don't restore static

                            # Presence stabs over other instruments
                            "ce_2" = 1
                            "al_2" = 0.06683   # -23.5 dB
                            "cr_2" = 14.0
                            "at_2" = 1.5
                            "rt_2" = 75.0
                            "kn_2" = 0.12589
                            "mk_2" = 1.0       # 0 dB — clarity kept

                            # Cymbals — sit cut-through; sparkle EQ after
                            "ce_3" = 1
                            "al_3" = 0.04732   # -26.5 dB
                            "cr_3" = 16.0
                            "at_3" = 1.0
                            "rt_3" = 140.0
                            "kn_3" = 0.10000
                            "mk_3" = 0.94406   # -0.5 dB — less average slice
                        }
                    }
                    # Overall keyboard level (after mid sit-down)
                    {
                        type    = builtin
                        name    = pad_rl
                        label   = bq_highshelf
                        control = { "Freq" = 10.0 "Q" = 0.7 "Gain" = 2.35 }
                    }
                    {
                        type    = builtin
                        name    = pad_rr
                        label   = bq_highshelf
                        control = { "Freq" = 10.0 "Q" = 0.7 "Gain" = 2.35 }
                    }
                    {
                        type    = builtin
                        name    = snare_rl
                        label   = bq_peaking
                        control = { "Freq" = 4400.0 "Q" = 2.6 "Gain" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = snare_rr
                        label   = bq_peaking
                        control = { "Freq" = 4400.0 "Q" = 2.6 "Gain" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = snare2_rl
                        label   = bq_peaking
                        control = { "Freq" = 5800.0 "Q" = 1.4 "Gain" = -7.0 }
                    }
                    {
                        type    = builtin
                        name    = snare2_rr
                        label   = bq_peaking
                        control = { "Freq" = 5800.0 "Q" = 1.4 "Gain" = -7.0 }
                    }
                    {
                        type    = builtin
                        name    = snap_rl
                        label   = bq_peaking
                        control = { "Freq" = 9800.0 "Q" = 2.8 "Gain" = 1.4 }
                    }
                    {
                        type    = builtin
                        name    = snap_rr
                        label   = bq_peaking
                        control = { "Freq" = 9800.0 "Q" = 2.8 "Gain" = 1.4 }
                    }
                    # 3) EDM grit notch ~6.1 kHz (capture peak cluster)
                    {
                        type    = builtin
                        name    = grit_rl
                        label   = bq_peaking
                        control = { "Freq" = 7200.0 "Q" = 1.6 "Gain" = -5.5 }
                    }
                    {
                        type    = builtin
                        name    = grit_rr
                        label   = bq_peaking
                        control = { "Freq" = 7200.0 "Q" = 1.6 "Gain" = -5.5 }
                    }
                    {
                        type    = builtin
                        name    = hiss_rl
                        label   = bq_highshelf
                        control = { "Freq" = 11500.0 "Q" = 1.4 "Gain" = 0.65 }
                    }
                    {
                        type    = builtin
                        name    = hiss_rr
                        label   = bq_highshelf
                        control = { "Freq" = 11500.0 "Q" = 1.4 "Gain" = 0.65 }
                    }

                    {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            # Note: LSP limiter rt/at max out at 20 ms — higher values are invalid
                            "alr"   = 0
                            "boost" = 0
                            "mode"  = 8         # Line Thin — clean ceiling
                            "at"    = 0.3
                            "rt"    = 14
                            "lk"    = 14
                            "ovs"   = 12
                            "th"    = 0.59566   # -4.5 dBFS — stacked stab pop
                            "knee"  = 0.35481
                        }
                    }

                    # Kill fizzy >12 kHz on keyboard; crisp lives below that
                    {
                        type    = builtin
                        name    = kb_aircut_l
                        label   = bq_lowpass
                        control = { "Freq" = 12000.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = kb_aircut_r
                        label   = bq_lowpass
                        control = { "Freq" = 12000.0 "Q" = 0.707 }
                    }
                    {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            "alr"   = 0
                            "boost" = 0
                            "mode"  = 8
                            "at"    = 0.35
                            "rt"    = 12
                            "lk"    = 12
                            "ovs"   = 12
                            "th"    = 0.47315   # -6.5 dBFS — stacked stab pop
                            "knee"  = 0.50119
                        }
                    }
                ]
                links = [
                    { output = "conv_l:Out"         input = "bassex:in_l" }
                    { output = "conv_r:Out"         input = "bassex:in_r" }
                    { output = "bassex:out_l"       input = "mbc:in_l" }
                    { output = "bassex:out_r"       input = "mbc:in_r" }
                    { output = "mbc:out_l"          input = "air_l:In" }
                    { output = "mbc:out_r"          input = "air_r:In" }
                    { output = "air_l:Out"          input = "clarity:in_l" }
                    { output = "air_r:Out"          input = "clarity:in_r" }
                    { output = "clarity:out_l"      input = "crisp_l:In" }
                    { output = "clarity:out_r"      input = "crisp_r:In" }
                    { output = "crisp_l:Out"        input = "crossover:in_l" }
                    { output = "crisp_r:Out"        input = "crossover:in_r" }
                    { output = "crossover:band0l"   input = "woofer_hp_l:In" }
                    { output = "crossover:band0r"   input = "woofer_hp_r:In" }
                    { output = "woofer_hp_l:Out"    input = "woofer_bass_l:In" }
                    { output = "woofer_hp_r:Out"    input = "woofer_bass_r:In" }
                    { output = "woofer_bass_l:Out"  input = "woofer_mud_l:In" }
                    { output = "woofer_bass_r:Out"  input = "woofer_mud_r:In" }
                    { output = "woofer_mud_l:Out"   input = "woofer_mid_l:In" }
                    { output = "woofer_mud_r:Out"   input = "woofer_mid_r:In" }
                    { output = "woofer_mid_l:Out"   input = "woofer_comp:in_l" }
                    { output = "woofer_mid_r:Out"   input = "woofer_comp:in_r" }
                    { output = "woofer_comp:out_l"  input = "limiter_f:in_l" }
                    { output = "woofer_comp:out_r"  input = "limiter_f:in_r" }
                    { output = "crossover:band1l"   input = "kb_hp_l:In" }
                    { output = "crossover:band1r"   input = "kb_hp_r:In" }
                    { output = "kb_hp_l:Out"        input = "kb_mud_l:In" }
                    { output = "kb_hp_r:Out"        input = "kb_mud_r:In" }
                    { output = "kb_mud_l:Out"       input = "kb_box_l:In" }
                    { output = "kb_mud_r:Out"       input = "kb_box_r:In" }
                    { output = "kb_box_l:Out"       input = "fagen_l:In" }
                    { output = "kb_box_r:Out"       input = "fagen_r:In" }
                    { output = "fagen_l:Out"        input = "kb_mbc:in_l" }
                    { output = "fagen_r:Out"        input = "kb_mbc:in_r" }
                    { output = "kb_mbc:out_l"       input = "pad_rl:In" }
                    { output = "kb_mbc:out_r"       input = "pad_rr:In" }
                    { output = "pad_rl:Out"         input = "snare_rl:In" }
                    { output = "pad_rr:Out"         input = "snare_rr:In" }
                    { output = "snare_rl:Out"       input = "snare2_rl:In" }
                    { output = "snare_rr:Out"       input = "snare2_rr:In" }
                    { output = "snare2_rl:Out"      input = "snap_rl:In" }
                    { output = "snare2_rr:Out"      input = "snap_rr:In" }
                    { output = "snap_rl:Out"        input = "grit_rl:In" }
                    { output = "snap_rr:Out"        input = "grit_rr:In" }
                    { output = "grit_rl:Out"        input = "hiss_rl:In" }
                    { output = "grit_rr:Out"        input = "hiss_rr:In" }
                    { output = "hiss_rl:Out"        input = "kb_aircut_l:In" }
                    { output = "hiss_rr:Out"        input = "kb_aircut_r:In" }
                    { output = "kb_aircut_l:Out"    input = "limiter_r:in_l" }
                    { output = "kb_aircut_r:Out"    input = "limiter_r:in_r" }
                ]
                inputs  = [ "conv_l:In" "conv_r:In" ]
                # HW PCM: FL/FR = woofers L/R, RL/RR = tweeters L/R (grouped — verified by ear)
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
            }
            capture.props = {
                node.name           = "audio_effect.slim7x_crossover"
                media.class         = Audio/Sink
                audio.channels      = 2
                audio.position      = [ FL FR ]
                device.api          = dsp
                node.virtual        = false
                priority.session    = 900
                device.icon-name    = "audio-speakers"
            }
            playback.props = {
                node.name           = "effect_output.slim7x_crossover"
                node.description    = "Slim 7x Speakers DSP Out"
                media.name          = "Slim 7x Speakers DSP Out"
                node.dont-fallback  = false
                node.passive        = true
                target.object       = "alsa_output.platform-sound.HiFi__Speaker__sink"
                audio.channels      = 4
                audio.position      = [ FL FR RL RR ]
            }
        }
    }
]
